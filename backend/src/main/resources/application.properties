spring.application.name=security-incidents-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/security_incidents?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-before-deployment-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

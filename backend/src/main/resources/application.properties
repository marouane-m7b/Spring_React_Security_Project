spring.application.name=security-incidents-api
server.port=8080
spring.datasource.url=jdbc:h2:mem:security_incidents;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-before-deployment-0123456789}
app.jwt.expiration-ms=3600000
